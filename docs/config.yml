site:
  site_name: "librawssg"
  description: "Safety-first kernel for static site generation in Rust"
  language: "en"
  base_url: "https://mroczect.biz.id/librawssg"
  author: "mroczect"
  repo_url: "https://github.com/mroczect/librawssg"
  license: "MIT"

  # Sidebar digunakan untuk daftar isi di dalam halaman
  sidebar:
    - label: "Home"
      url: "index.html"
    - label: "Installation"
      url: "installation.html"
    - label: "Configuration"
      url: "configuration.html"
    - label: "API Reference"
      url: "references.html"
    - label: "Contributing"
      url: "contributing.html"
    - label: "Code of Conduct"
      url: "code_of_conduct.html"
    - label: "License"
      url: "license.html"

build:
  content_dir: "content"
  output_dir: "dist"
  templates_dir: "templates"
  static_dir: "static"

content_types:
  - name: "page"
    pattern: "*.md"
    template: "base.html"
    list_enabled: false

generators:
  rss:
    enabled: false
  sitemap:
    enabled: false
