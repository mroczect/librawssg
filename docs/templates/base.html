<!DOCTYPE html>
<html lang="{{ site.language | default(value='en') }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - {{ site.site_name }}</title>
    <meta name="description" content="{{ page_desc }}">
    <link rel="stylesheet" href="{{ base_path }}normalize.css">
    <link rel="stylesheet" href="{{ base_path }}sidebar.css">
    <link rel="stylesheet" href="{{ base_path }}style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        pre {
            border-radius: 8px;
            padding: 0 !important;
            margin: 1.5em 0;
            background: #0d1117;
            overflow-x: auto;
        }
        pre code.hljs {
            padding: 1em;
            font-size: 14px;
            line-height: 1.6;
            display: block;
        }
        :not(pre) > code {
            background: #f0f0f0;
            color: #d63384;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
        }
        @media (prefers-color-scheme: dark) {
            :not(pre) > code {
                background: #1e1e1e;
                color: #f08d49;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar">
            <h2><a href="{{ base_path }}index.html">{{ site.site_name }}</a></h2>
            <nav>
                <ul>
                    {% for item in site.sidebar %}
                    <li>
                        <a href="{{ base_path }}{{ item.url }}"
                           {% if page_url == item.url %}class="active"{% endif %}>
                            {{ item.label }}
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            </nav>
        </aside>
        <main class="content">
            <div class="container-lg px-3 my-5 markdown-body">
                <h1>{{ page_title }}</h1>
                {{ page_content | safe }}
            </div>
            <footer class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
                <small>Built with <a href="{{ site.repo_url }}">librawssg</a> &middot; Licensed under {{ site.license | default(value='MIT') }}</small>
            </footer>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            hljs.highlightAll();
        });
    </script>
</body>
</html>
