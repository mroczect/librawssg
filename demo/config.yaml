site:
  site_name: "My librawssg Site"
  description: "A static site built with librawssg"
  language: "id"
  base_url: "https://example.com"
  author: "Your Name"
  navbar:
    - label: "Beranda"
      url: "/"
    - label: "Tentang"
      url: "/about.html"
    - label: "Blog"
      url: "/blog/index.html"
  sidebar:
    - label: "RSS"
      url: "/rss.xml"

build:
  content_dir: "content"
  output_dir: "./dist"
  templates_dir: "templates"
  static_dir: "static"

content_types:
  - name: "page"
    pattern: "*.md"
    template: "base.html"
    list_enabled: false
  - name: "blog"
    pattern: "blog/*.md"
    template: "blog_post.html"
    list_template: "blog_list.html"
    list_enabled: true

generators:
  rss:
    enabled: false
    path: "rss.xml"
    template: "rss.xml"
  sitemap:
    enabled: false
    path: "sitemap.xml"
    template: "sitemap.xml"
