<!DOCTYPE html>
<html lang="{{ site_language }}">
<head>
    <meta charset="utf-8">
    <title>{{ page_title }} - {{ site_name }}</title>
    <meta name="description" content="{{ page_desc }}">
    <link rel="stylesheet" href="{{ base_path }}style.css">
</head>
<body>
    <header>
        <h1><a href="{{ base_path }}index.html">{{ site_name }}</a></h1>
    </header>
    <main>
        {% block content %}
        <h2>{{ page_title }}</h2>
        {{ page_content | safe }}
        {% endblock %}
    </main>
    <footer>
        <small>Built with librawssg</small>
    </footer>
</body>
</html>
