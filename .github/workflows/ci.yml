name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  base:
    name: Base checks (no features)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-base-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-base-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (no features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (debug, no features)
        run: cargo build --workspace --all-targets

      - name: Run tests (no features)
        run: cargo test --workspace --all-targets --verbose

  features:
    name: Full feature checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build (debug, all features)
        run: cargo build --workspace --all-targets --all-features

      - name: Run tests (all features)
        run: cargo test --workspace --all-targets --all-features --verbose

      - name: Build (release, all features)
        run: cargo build --workspace --all-targets --all-features --release
